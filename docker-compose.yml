version: '3.8'

services:
  app:
    build: .
    container_name: ecommerce_app
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: ecommerce_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=the_drop_vinyls
    volumes:
      - db_data:/var/lib/mysql
      # Initialize the database with the provided SQL file
      - ./src/the_drop_vinyls.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  db_data:
